<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video Transcript Voiceover</title>
    <link rel="stylesheet" href="popup.css">
    <script src="dist/popup.js" defer></script>
  </head>
  <body>
    <h1>Transcript voiceover</h1>
    <label class="toggle-row">
      <span>Enable voiceover bubble</span>
      <input id="bubble-enabled" type="checkbox" role="switch" aria-describedby="bubble-status" disabled>
    </label>
    <p id="bubble-status" role="status">Loading your preference…</p>
  </body>
</html>
